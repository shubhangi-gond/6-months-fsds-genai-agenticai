<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-chess-king"></i>
                    <h1>Modern Chess</h1>
                </div>
                <div class="game-controls">
                    <button id="newGameBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        New Game
                    </button>
                    <button id="undoBtn" class="btn btn-secondary">
                        <i class="fas fa-undo"></i>
                        Undo
                    </button>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="game-info">
                <div class="player-info player-white">
                    <div class="player-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="player-details">
                        <h3>White Player</h3>
                        <div class="captured-pieces" id="whiteCaptured"></div>
                    </div>
                    <div class="player-timer" id="whiteTimer">10:00</div>
                </div>
                
                <div class="chess-board-container">
                    <div class="game-status">
                        <div class="status-indicator">
                            <span id="gameStatus">White to move</span>
                        </div>
                        <div class="move-counter">
                            Move: <span id="moveNumber">1</span>
                        </div>
                    </div>
                    
                    <div class="chess-board" id="chessBoard">
                        <!-- Chess board squares will be generated by JavaScript -->
                    </div>
                    
                    <div class="board-coordinates">
                        <div class="files">
                            <span>a</span><span>b</span><span>c</span><span>d</span>
                            <span>e</span><span>f</span><span>g</span><span>h</span>
                        </div>
                        <div class="ranks">
                            <span>8</span><span>7</span><span>6</span><span>5</span>
                            <span>4</span><span>3</span><span>2</span><span>1</span>
                        </div>
                    </div>
                </div>

                <div class="player-info player-black">
                    <div class="player-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="player-details">
                        <h3>Black Player</h3>
                        <div class="captured-pieces" id="blackCaptured"></div>
                    </div>
                    <div class="player-timer" id="blackTimer">10:00</div>
                </div>
            </div>

            <div class="game-sidebar">
                <div class="moves-panel">
                    <h3>
                        <i class="fas fa-list"></i>
                        Move History
                    </h3>
                    <div class="moves-list" id="movesList">
                        <div class="moves-header">
                            <span>#</span>
                            <span>White</span>
                            <span>Black</span>
                        </div>
                        <!-- Moves will be added dynamically -->
                    </div>
                </div>

                <div class="game-options">
                    <h3>
                        <i class="fas fa-cog"></i>
                        Options
                    </h3>
                    <div class="option-group">
                        <label class="toggle-option">
                            <input type="checkbox" id="highlightMoves" checked>
                            <span class="toggle-slider"></span>
                            Highlight Valid Moves
                        </label>
                        <label class="toggle-option">
                            <input type="checkbox" id="soundEffects" checked>
                            <span class="toggle-slider"></span>
                            Sound Effects
                        </label>
                        <label class="toggle-option">
                            <input type="checkbox" id="showCoordinates" checked>
                            <span class="toggle-slider"></span>
                            Show Coordinates
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <div class="game-modal" id="gameModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Game Over</h2>
                    <button class="modal-close" id="modalClose">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <p id="modalMessage">Checkmate! White wins!</p>
                    <div class="modal-actions">
                        <button id="newGameFromModal" class="btn btn-primary">New Game</button>
                        <button id="closeModal" class="btn btn-secondary">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="chess.js"></script>
</body>
</html>
